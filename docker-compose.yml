version: '3.8'

services:
  cyberrfp:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyberrfp-maroc:latest
    container_name: cyberrfp_maroc_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cyberrfp2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_PATH=/app/data/cyberrfp.db
      - TZ=Africa/Casablanca
      - ALLOWED_DOMAIN=dpg-cyber.com
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - cyberrfp_data:/app/data
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/tenders?limit=1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cyberrfp_data:
    driver: local
