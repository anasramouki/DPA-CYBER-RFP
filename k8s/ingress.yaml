apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyberrfp-ingress
  namespace: cyberrfp
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: rfp.dpg-cyber.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cyberrfp-service
                port:
                  number: 80
