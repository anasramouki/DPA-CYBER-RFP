apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberrfp-deployment
  namespace: cyberrfp
  labels:
    app: cyberrfp
    tier: frontend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberrfp
  template:
    metadata:
      labels:
        app: cyberrfp
    spec:
      containers:
        - name: cyberrfp-web
          image: cyberrfp-maroc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cyberrfp-config
            - secretRef:
                name: cyberrfp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/tenders?limit=1
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/tenders?limit=1
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: cyberrfp-data-pvc
